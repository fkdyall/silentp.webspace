<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090b12">
  <meta name="description" content="FYPM Browser — persistent, isolated browsing identities.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <title>FYPM Browser</title>
</head>
<body>
  <div class="browser-shell">
    <header class="tab-strip">
      <button class="brand-button" id="newTabButton" title="New tab" aria-label="FYPM Browser new tab"><span>FY</span></button>
      <div class="tab-list" id="tabList" role="tablist"></div>
      <button class="chrome-button tab-add" id="tabAddButton" title="New tab (Ctrl+T)" aria-label="New tab">＋</button>
      <span class="resource-summary" id="resourceSummary">0 live</span>
      <button class="chrome-button" id="mainMenuButton" title="FYPM menu" aria-expanded="false">•••</button>
    </header>

    <nav class="toolbar" aria-label="Browser controls">
      <button class="chrome-button" data-command="back" title="Back (Alt+Left)">←</button>
      <button class="chrome-button" data-command="forward" title="Forward (Alt+Right)">→</button>
      <button class="chrome-button" data-command="reload" title="Reload (Ctrl+R)">↻</button>
      <form class="address-form" id="addressForm">
        <span class="address-mark">◇</span>
        <input id="addressInput" autocomplete="off" spellcheck="false" aria-label="Search or enter address" placeholder="Search or enter address">
        <div class="container-chooser" id="containerChooser" hidden></div>
      </form>
      <button class="container-badge" id="containerBadge" title="Current container"><span class="container-dot" id="containerDot"></span><span id="containerName">New tab</span></button>
      <button class="chrome-button" id="permissionsButton" title="Site permissions" aria-expanded="false">◆</button>
      <div class="download-chip" id="downloadChip" hidden></div>
    </nav>

    <main class="new-tab" id="newTabView">
      <div class="new-tab-card">
        <p class="eyebrow">FUCK YOU PAY ME</p>
        <h1>FYPM Browser</h1>
        <p class="lede">Browse normally. Keep every identity in its own lane.</p>
        <form class="start-search" id="startSearchForm">
          <input id="startSearchInput" autocomplete="off" spellcheck="false" aria-label="Search or enter address" placeholder="Search the web or type a URL">
          <button type="submit">Go</button>
        </form>
        <section class="shortcut-section">
          <div class="section-heading"><h2>Containers</h2><button id="createContainerButton">New isolated container</button></div>
          <div class="shortcut-grid" id="containerShortcuts"></div>
        </section>
      </div>
    </main>

    <aside class="popover permissions-popover" id="permissionsPopover" hidden>
      <header><div><strong id="permissionsContainerName">Container</strong><small id="permissionsPreset">Preset: Hardened</small></div><button data-close-popover="permissionsPopover">×</button></header>
      <div class="permission-controls" id="permissionControls"></div>
      <label class="preset-row"><span>Apply template</span><select id="permissionPreset"><option value="custom">Custom</option><option value="hardened">Hardened</option><option value="balanced">Balanced</option><option value="compatibility">Compatibility</option></select></label>
    </aside>

    <aside class="popover main-menu" id="mainMenu" hidden>
      <button id="keepActiveMenuItem">Keep Active: Off</button>
      <button id="parkTabMenuItem">Park current tab</button>
      <button id="releaseInactiveMenuItem">Release inactive</button>
      <button id="manageContainersMenuItem">Manage containers</button>
      <button id="newWindowMenuItem">New window</button>
      <hr>
      <button class="danger" id="quitReleaseMenuItem">Exit &amp; Free Resources</button>
    </aside>
  </div>

  <dialog id="containerDialog">
    <form method="dialog" class="dialog-shell" id="containerForm">
      <header><div><p class="eyebrow">ISOLATED IDENTITY</p><h2 id="containerDialogTitle">Container</h2></div><button value="cancel" aria-label="Close">×</button></header>
      <input type="hidden" id="containerId">
      <label>Name<input id="containerFieldName" required></label>
      <label>Home address<input id="containerFieldUrl" inputmode="url"></label>
      <label>Related domains <small>One per line. Prefix suffix matches with <code>*.</code>.</small><textarea id="containerFieldDomains" rows="5"></textarea></label>
      <label>Starting template<select id="containerFieldPreset"><option value="hardened">Hardened</option><option value="balanced">Balanced</option><option value="compatibility">Compatibility</option><option value="custom">Custom</option></select></label>
      <div class="dialog-actions"><button type="button" class="danger" id="deleteContainerButton">Delete</button><span></span><button value="cancel">Cancel</button><button type="submit" value="default" class="primary">Save</button></div>
    </form>
  </dialog>

  <div class="toast" id="toast" hidden></div>
  <script src="./app.js"></script>
</body>
</html>
