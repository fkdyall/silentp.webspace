name: Build FYPM Browser test AppImage

on:
  push:
    branches:
      - feat/fypm-browser-first-test-build

jobs:
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: sha256sum dist/FYPM-Browser-*.AppImage > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fypm-browser-linux-x86_64
          path: |
            desktop/dist/FYPM-Browser-*.AppImage
            desktop/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
